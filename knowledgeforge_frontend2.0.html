<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeForge AI — Local Enterprise RAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
/* ========================================
   Design Tokens
   ======================================== */
:root {
    --bg-deep: oklch(0.065 0.012 150);
    --bg-base: oklch(0.09 0.015 150);
    --bg-surface: oklch(0.12 0.018 150);
    --bg-elevated: oklch(0.16 0.02 150);
    --bg-overlay: oklch(0.065 0.012 150 / 0.92);
    --border: oklch(0.24 0.025 150);
    --border-bright: oklch(0.35 0.04 150);
    --green: oklch(0.78 0.16 145);
    --green-dim: oklch(0.55 0.10 145);
    --green-bright: oklch(0.96 0.02 260);
    --green-bg: oklch(0.78 0.16 145 / 0.10);
    --green-bg-strong: oklch(0.78 0.16 145 / 0.18);
    --amber: oklch(0.80 0.14 85);
    --amber-dim: oklch(0.55 0.10 85);
    --amber-bg: oklch(0.80 0.14 85 / 0.10);
    --red: oklch(0.65 0.22 25);
    --red-bg: oklch(0.65 0.22 25 / 0.10);
    --cyan: oklch(0.75 0.10 210);
    --cyan-bg: oklch(0.75 0.10 210 / 0.10);
    --text: oklch(0.95 0.01 260);
    --text-dim: oklch(0.65 0.02 260);
    --text-muted: oklch(0.58 0.02 260);
    --glow: 0 0 8px oklch(0.78 0.16 145 / 0.25);
    --glow-strong: 0 0 16px oklch(0.78 0.16 145 / 0.35);
    --shadow: 0 2px 12px oklch(0 0 0 / 0.5);
    --font-display: 'VT323', monospace;
    --font-mono: 'Share Tech Mono', 'Courier New', monospace;
    --dur: 120ms;
    --ease: linear;
}
/* ========================================
   Reset & Base
   ======================================== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{font-family:var(--font-mono);font-size:1rem;line-height:1.55;color:var(--text);background:var(--bg-deep);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:oklch(0.78 0.16 145 / 0.3);color:var(--green-bright)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg-deep)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:0}
::-webkit-scrollbar-thumb:hover{background:var(--green-dim)}
.hidden{display:none!important}
/* ========================================
   Scanline Overlay (CRT Effect)
   ======================================== */
body::after{
    content:'';
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    background:repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        oklch(0 0 0 / 0.06) 2px,
        oklch(0 0 0 / 0.06) 4px
    );
    mix-blend-mode:multiply;
}
/* ========================================
   App Shell
   ======================================== */
.app{display:flex;height:100vh;width:100vw}
/* ========================================
   Sidebar
   ======================================== */
.sidebar{
    width:260px;
    background:var(--bg-base);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    z-index:10;
    position:relative;
}
.sidebar::after{
    content:'';
    position:absolute;
    top:0;right:0;bottom:0;
    width:1px;
    background:var(--green);
    opacity:0.15;
    box-shadow:0 0 8px oklch(0.78 0.16 145 / 0.2);
}
.sidebar-header{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
}
.logo-line{
    font-family:var(--font-display);
    font-size:1.1rem;
    color:var(--green);
    text-shadow:0 0 10px oklch(0.78 0.16 145 / 0.4);
    white-space:pre;
    line-height:1.15;
    margin-bottom:6px;
}
.version-line{
    font-family:var(--font-mono);
    font-size:0.7rem;
    color:var(--text-dim);
    letter-spacing:0.5px;
}
.sidebar-nav{
    padding:8px 0;
    border-bottom:1px solid var(--border);
}
.nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 16px;
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-family:var(--font-mono);
    font-size:0.875rem;
    cursor:pointer;
    transition:all var(--dur) var(--ease);
    text-align:left;
    width:100%;
    border-left:2px solid transparent;
}
.nav-item:hover{
    background:var(--bg-surface);
    color:var(--text);
}
.nav-item.active{
    background:var(--green-bg);
    color:var(--green);
    border-left-color:var(--green);
}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:0.7}
.nav-item.active svg{opacity:1}
.nav-badge{
    margin-left:auto;
    font-size:0.7rem;
    color:var(--text-muted);
}
.nav-key{
    font-size:0.65rem;
    color:var(--text-muted);
    margin-left:auto;
    opacity:0.5;
}
/* ========================================
   Conversation List
   ======================================== */
.sidebar-content{flex:1;overflow-y:auto;padding:8px 0}
.conv-header{
    font-size:0.7rem;
    color:var(--text-muted);
    padding:4px 16px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-transform:uppercase;
    letter-spacing:1px;
}
.new-conv-btn{
    background:transparent;
    border:1px dashed var(--border);
    color:var(--text-dim);
    font-family:var(--font-mono);
    font-size:0.7rem;
    padding:2px 8px;
    cursor:pointer;
    transition:all var(--dur) var(--ease);
}
.new-conv-btn:hover{
    border-color:var(--green);
    color:var(--green);
}
.conv-list{display:flex;flex-direction:column;gap:1px}
.conv-item{
    padding:8px 16px;
    cursor:pointer;
    transition:all var(--dur) var(--ease);
    display:flex;
    flex-direction:column;
    gap:2px;
    position:relative;
    border-left:2px solid transparent;
}
.conv-item:hover{background:var(--bg-surface)}
.conv-item.active{
    background:var(--green-bg);
    border-left-color:var(--green);
}
.conv-title{
    font-size:0.8125rem;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.conv-item.active .conv-title{color:var(--green)}
.conv-time{font-size:0.65rem;color:var(--text-muted)}
.conv-delete{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:transparent;border:none;color:var(--text-muted);
    cursor:pointer;padding:2px;opacity:0;transition:opacity var(--dur);
}
.conv-item:hover .conv-delete{opacity:1}
.conv-delete:hover{color:var(--red)}
/* ========================================
   Sidebar Footer
   ======================================== */
.sidebar-footer{
    padding:10px 16px;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:8px;
}
.status-dot{
    width:6px;height:6px;
    background:var(--green);
    box-shadow:0 0 6px var(--green);
    animation:pulse 2s ease-in-out infinite;
    flex-shrink:0;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-text{font-size:0.7rem;color:var(--text-dim)}
.status-text strong{color:var(--green);font-weight:400}
/* ========================================
   Main Area
   ======================================== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.view{display:none;flex-direction:column;height:100%}
.view.active{display:flex}
/* ========================================
   Topbar
   ======================================== */
.topbar{
    height:44px;
    border-bottom:1px solid var(--border);
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--bg-base);
    flex-shrink:0;
    z-index:5;
}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-title{
    font-family:var(--font-display);
    font-size:1.05rem;
    color:var(--green);
    text-shadow:0 0 6px oklch(0.78 0.16 145 / 0.2);
}
.topbar-subtitle{font-size:0.7rem;color:var(--text-muted)}
.topbar-actions{display:flex;align-items:center;gap:6px}
.topbar-btn{
    display:flex;align-items:center;gap:5px;
    padding:5px 10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    font-family:var(--font-mono);
    font-size:0.75rem;
    cursor:pointer;
    transition:all var(--dur) var(--ease);
}
.topbar-btn:hover{border-color:var(--green-dim);color:var(--text)}
.topbar-btn.active{
    border-color:var(--green);
    color:var(--green);
    background:var(--green-bg);
}
.topbar-btn svg{width:12px;height:12px}
/* ========================================
   Chat View
   ======================================== */
.chat-area{
    flex:1;overflow-y:auto;
    padding:20px 10%;
    display:flex;flex-direction:column;gap:14px;
}
.welcome{
    text-align:center;
    margin:auto 0;
    padding:40px 20px;
}
.ascii-art{
    font-family:var(--font-display);
    font-size:0.85rem;
    color:var(--green);
    text-shadow:0 0 12px oklch(0.78 0.16 145 / 0.3);
    white-space:pre;
    line-height:1.2;
    margin-bottom:16px;
}
.welcome-sub{
    font-size:0.8rem;
    color:var(--text-dim);
    max-width:500px;
    margin:0 auto 24px;
    line-height:1.6;
}
.suggestions{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:8px;
    max-width:680px;
    margin:0 auto;
}
.suggestion{
    background:var(--bg-surface);
    border:1px solid var(--border);
    padding:14px;
    text-align:left;
    cursor:pointer;
    transition:all var(--dur) var(--ease);
}
.suggestion:hover{
    border-color:var(--green);
    background:var(--bg-elevated);
    box-shadow:var(--glow);
}
.suggestion-prompt{
    font-family:var(--font-display);
    font-size:0.8rem;
    color:var(--green);
    margin-bottom:6px;
}
.suggestion h4{
    font-family:var(--font-mono);
    font-size:0.8rem;
    font-weight:400;
    color:var(--text);
    margin-bottom:3px;
}
.suggestion p{
    font-size:0.7rem;
    color:var(--text-dim);
    line-height:1.4;
}
/* Messages */
.message{
    display:flex;gap:10px;max-width:780px;
}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.message.assistant{align-self:flex-start;width:100%}
.msg-avatar{
    width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-family:var(--font-display);
    font-size:0.9rem;
}
.user .msg-avatar{color:var(--amber)}
.assistant .msg-avatar{color:var(--green)}
.bubble{
    padding:12px 14px;
    font-size:0.875rem;
    line-height:1.6;
    border:1px solid var(--border);
}
.user .bubble{
    background:var(--bg-surface);
    color:var(--amber);
    border-color:var(--amber-dim);
    max-width:85%;
}
.user .bubble::before{
    content:'> ';
    color:var(--amber-dim);
}
.assistant .bubble{
    background:var(--bg-base);
    color:var(--text);
    border-color:var(--border);
    width:100%;
    position:relative;
}
.assistant .bubble::before{
    content:'$ ';
    color:var(--green-dim);
    font-family:var(--font-display);
}
.assistant .bubble a{color:var(--green);text-decoration:none}
.assistant .bubble a:hover{text-decoration:underline}
.assistant .bubble code{
    font-family:var(--font-mono);
    font-size:0.85em;
    background:oklch(0 0 0 / 0.3);
    padding:1px 4px;
    color:var(--cyan);
}
/* Pipeline (Terminal Style) */
.pipeline{
    display:flex;align-items:center;gap:0;
    padding:8px 12px;
    background:oklch(0 0 0 / 0.3);
    border:1px solid var(--border);
    margin:10px 0;
    overflow-x:auto;
    font-family:var(--font-mono);
    font-size:0.75rem;
}
.pipeline-step{
    display:flex;align-items:center;gap:4px;
    padding:3px 6px;
    transition:all 200ms var(--ease);
    white-space:nowrap;
}
.pipeline-step.active{color:var(--green);text-shadow:0 0 6px oklch(0.78 0.16 145 / 0.3)}
.pipeline-step.done{color:var(--green-dim)}
.pipeline-step.pending{color:var(--text-muted)}
.step-marker{
    font-family:var(--font-display);
    font-size:0.85rem;
}
.pipeline-step.done .step-marker::after{content:' ✓'}
.pipeline-step.active .step-marker{animation:blink 0.8s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pipeline-connector{
    color:var(--text-muted);
    padding:0 2px;
    font-family:var(--font-display);
}
.pipeline-connector.done{color:var(--green-dim)}
.pipeline-connector.active{color:var(--green)}
/* Source Panel */
.source-panel{
    margin-top:12px;
    border-top:1px solid var(--border);
    padding-top:8px;
}
.source-toggle{
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;
    font-size:0.8rem;
    color:var(--text-dim);
    padding:6px 8px;
    background:oklch(0 0 0 / 0.2);
    border:1px solid var(--border);
    transition:all var(--dur) var(--ease);
    width:100%;text-align:left;
    font-family:var(--font-mono);
}
.source-toggle:hover{background:var(--bg-surface);color:var(--text)}
.conf-badge{
    font-family:var(--font-mono);
    font-size:0.7rem;
    padding:1px 6px;
    background:var(--green-bg);
    color:var(--green);
    display:flex;align-items:center;gap:4px;
}
.sources{
    margin-top:6px;
    display:flex;flex-direction:column;gap:4px;
}
.source-card{
    background:oklch(0 0 0 / 0.25);
    border:1px solid var(--border);
    padding:8px 10px;
}
.source-top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:4px;
}
.source-file{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--green);
}
.source-scores{
    font-family:var(--font-mono);
    font-size:0.7rem;
    color:var(--text-muted);
}
.source-snippet{
    font-family:var(--font-mono);
    font-size:0.7rem;
    color:var(--text-dim);
    background:oklch(0 0 0 / 0.3);
    padding:6px 8px;
    border-left:2px solid var(--green-dim);
    max-height:72px;
    overflow-y:auto;
    line-height:1.5;
    white-space:pre-wrap;
}
/* Typing Indicator */
.typing{
    display:flex;align-items:center;gap:8px;
    color:var(--green);
    font-size:0.8rem;
}
.typing-cursor{
    display:inline-block;
    width:8px;height:1.1em;
    background:var(--green);
    animation:blink 0.7s step-end infinite;
    vertical-align:middle;
}
/* Input Bar */
.input-bar{
    padding:12px 10%;
    background:var(--bg-base);
    border-top:1px solid var(--border);
}
.input-box{
    background:var(--bg-surface);
    border:1px solid var(--border);
    padding:4px 4px 4px 12px;
    display:flex;align-items:flex-end;gap:6px;
    transition:all var(--dur) var(--ease);
}
.input-box:focus-within{
    border-color:var(--green);
    box-shadow:var(--glow);
}
.input-prompt{
    font-family:var(--font-display);
    font-size:1.1rem;
    color:var(--green);
    padding-bottom:7px;
    flex-shrink:0;
    text-shadow:0 0 6px oklch(0.78 0.16 145 / 0.3);
}
.input-box textarea{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:0.875rem;
    resize:none;
    max-height:120px;
    padding:8px 0;
    outline:none;
    line-height:1.5;
}
.input-box textarea::placeholder{color:var(--text-muted)}
.input-actions{display:flex;align-items:center;gap:2px;padding-bottom:4px}
.input-btn{
    background:transparent;border:none;
    color:var(--text-muted);
    cursor:pointer;padding:6px;
    transition:all var(--dur) var(--ease);
    display:flex;align-items:center;justify-content:center;
}
.input-btn:hover{color:var(--text);background:var(--bg-elevated)}
.send-btn{
    background:var(--green-bg);
    color:var(--green);
    border:1px solid var(--green-dim);
    padding:6px 12px;
    font-family:var(--font-mono);
    font-size:0.8rem;
    cursor:pointer;
    display:flex;align-items:center;gap:5px;
    transition:all var(--dur) var(--ease);
}
.send-btn:hover{
    background:var(--green);
    color:var(--bg-deep);
    box-shadow:var(--glow);
}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
/* ========================================
   Documents View
   ======================================== */
.doc-content{flex:1;overflow-y:auto;padding:16px 20px}
.doc-toolbar{
    display:flex;align-items:center;gap:10px;
    margin-bottom:14px;
}
.doc-search{
    flex:1;display:flex;align-items:center;gap:6px;
    background:var(--bg-surface);
    border:1px solid var(--border);
    padding:7px 10px;
    transition:all var(--dur) var(--ease);
}
.doc-search:focus-within{border-color:var(--green);box-shadow:var(--glow)}
.doc-search svg{width:13px;height:13px;color:var(--text-muted);flex-shrink:0}
.doc-search input{
    flex:1;background:transparent;border:none;
    color:var(--text);font-family:var(--font-mono);
    font-size:0.8rem;outline:none;
}
.doc-search input::placeholder{color:var(--text-muted)}
.upload-btn{
    display:flex;align-items:center;gap:5px;
    padding:7px 12px;
    border:1px solid var(--green-dim);
    background:var(--green-bg);
    color:var(--green);
    font-family:var(--font-mono);
    font-size:0.8rem;
    cursor:pointer;
    transition:all var(--dur) var(--ease);
    white-space:nowrap;
}
.upload-btn:hover{background:var(--green);color:var(--bg-deep)}
.upload-btn svg{width:13px;height:13px}
.doc-table-wrap{border:1px solid var(--border);overflow:hidden}
.doc-table{width:100%;border-collapse:collapse}
.doc-table th{
    background:var(--bg-elevated);
    padding:8px 12px;
    font-size:0.7rem;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--text-muted);
    text-align:left;
    border-bottom:1px solid var(--border);
}
.doc-table td{
    padding:8px 12px;
    font-size:0.8rem;
    color:var(--text);
    border-bottom:1px solid var(--border);
    vertical-align:middle;
}
.doc-table tr:last-child td{border-bottom:none}
.doc-table tr:hover td{background:var(--bg-surface)}
.doc-table input[type="checkbox"]{
    accent-color:var(--green);
    width:13px;height:13px;cursor:pointer;
}
.doc-type-badge{
    font-family:var(--font-mono);
    font-size:0.65rem;
    padding:1px 5px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    border:1px solid var(--border);
}
.badge-pdf{color:var(--red);border-color:var(--red)}
.badge-md{color:var(--cyan);border-color:var(--cyan)}
.badge-docx{color:var(--green);border-color:var(--green)}
.badge-py{color:var(--amber);border-color:var(--amber)}
.badge-txt{color:var(--text-dim);border-color:var(--border)}
.badge-csv{color:var(--cyan);border-color:var(--cyan)}
.doc-status{display:flex;align-items:center;gap:5px;font-size:0.75rem}
.doc-status-dot{
    width:5px;height:5px;
    flex-shrink:0;
}
.doc-status-dot.indexed{background:var(--green)}
.doc-status-dot.indexing{background:var(--amber);animation:pulse 1.2s infinite}
.doc-status-dot.error{background:var(--red)}
.doc-delete-btn{
    background:transparent;border:none;
    color:var(--text-muted);cursor:pointer;
    padding:3px;transition:all var(--dur);
    display:flex;align-items:center;justify-content:center;
}
.doc-delete-btn:hover{color:var(--red);background:var(--red-bg)}
.doc-empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
.doc-empty h3{font-size:0.9rem;color:var(--text-dim);margin-bottom:4px;font-weight:400}
.doc-empty p{font-size:0.8rem}
/* Drop overlay */
.drop-overlay{
    position:fixed;inset:0;
    background:oklch(0.065 0.012 150 / 0.94);
    z-index:200;display:none;
    align-items:center;justify-content:center;
}
.drop-overlay.active{display:flex}
.drop-overlay-inner{
    border:2px dashed var(--green);
    padding:50px 70px;
    text-align:center;
    background:var(--green-bg);
}

.chart-card{

}
.chart-card h3{

.activity-list{display:flex;flex-direction:column;gap:0}

/* ========================================
   Settings View
   ======================================== */
.settings-content{flex:1;overflow-y:auto;padding:16px 20px;max-width:640px}
.settings-section{margin-bottom:24px}
.settings-section h3{
    font-family:var(--font-display);

    color:var(--green);
    margin-bottom:12px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
}
.setting-row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.setting-label{
    display:flex;justify-content:space-between;
    font-size:0.8rem;
    color:var(--text);
}
.setting-value{
    font-family:var(--font-mono);
    font-size:0.8rem;
    color:var(--green);
}
.setting-hint{font-size:0.65rem;color:var(--text-muted)}
.setting-slider{
    width:100%;height:3px;

    background:var(--bg-elevated);

}
.setting-slider::-webkit-slider-thumb{

    width:14px;height:14px;
    background:var(--green);

    border:2px solid var(--bg-surface);

}
.setting-slider::-webkit-slider-thumb:hover{

}
.setting-slider::-moz-range-thumb{

    background:var(--green);
    cursor:pointer;
    border:2px solid var(--bg-surface);
}
.setting-toggle{
    display:flex;align-items:center;gap:8px;

}

.toast-container{
    position:fixed;bottom:16px;right:16px;
    z-index:400;
    display:flex;flex-direction:column;gap:6px;
    pointer-events:none;
}
.toast{
    pointer-events:auto;
    display:flex;align-items:center;gap:8px;
    padding:8px 14px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    font-size:0.8rem;
    color:var(--text);

}
.toast.success{border-color:var(--green)}
.toast.error{border-color:var(--red)}
.toast.info{border-color:var(--amber)}

.toast-close{

    color:var(--text-muted);cursor:pointer;
    padding:2px;display:flex;transition:color var(--dur);
}
.toast-close:hover{color:var(--text)}
@keyframes toastIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
/* ========================================
   Reduced Motion
   ======================================== */
@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
    }

<script>
/* ========================================
   Application State
   ======================================== */
let defaultApp = {
    conversations: [{ id: 1, title: 'New Conversation', messages: [], created: Date.now() }],
    activeConvId: 1,
    nextConvId: 2,
    documents: [],
    nextDocId: 1,
    view: 'chat',
    settings: { chunkSize: 500, chunkOverlap: 50, topK: 10, rerankTopK: 3, reranker: true, hybrid: true, model: 'gemma-3-4b-native' },
    activity: [],
    queryCount: 0
};

let APP = {
    conversations: [{ id: 1, title: 'New Conversation', messages: [], created: Date.now() }],
    activeConvId: 1,
    nextConvId: 2,
    documents: [],
    nextDocId: 1,
    view: 'chat',
    settings: { chunkSize: 500, chunkOverlap: 50, topK: 10, rerankTopK: 3, reranker: true, hybrid: true, model: 'gemma-3-4b-native' },
    activity: [],
    queryCount: 0
};

try {
    const saved = localStorage.getItem('kf_app_state');
    if (saved) {
        const savedApp = JSON.parse(saved);
        if (savedApp.settings) {
            APP.settings = savedApp.settings; // Only keep settings, start completely fresh otherwise!
        }
    }
} catch(e) {
    console.error("Failed to load state", e);
}

function saveState() {
    try {
        localStorage.setItem('kf_app_state', JSON.stringify(APP));
    } catch(e) {
        console.error("Failed to save state", e);
    }
}

// Fetch the actual source of truth from the Python backend
window.addEventListener('pywebviewready', function() {
    window.pywebview.api.get_database_status().then(res => {
        if (res.success) {
            APP.documents = res.documents;
            APP.nextDocId = APP.documents.length + 1;
            saveState();
            if (APP.view === 'documents') renderDocuments();
            renderAnalytics();
        }
    });

        error: '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
        info: '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
    };
    t.innerHTML = `${icons[type] || icons.info}<span class="toast-msg">${esc(msg)}</span><button class="toast-close" onclick="this.parentElement.remove()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;

function handleInputKey(e) {
    if (e.key === 'Enter' && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); sendQuery(); }
    if (e.key === 'Enter' && e.ctrlKey) { /* allow newline */ }
}

function sendQuickQuery(text) {
    $('#query-input').value = text;
    sendQuery();
}

function sendQuery() {
    const input = $('#query-input');
    const text = input.value.trim();
    if (!text) return;

    const conv = getActiveConv();
    conv.messages.push({ role: 'user', content: text });
    if (conv.messages.length === 1) {
        conv.title = text.length > 40 ? text.slice(0, 40) + '...' : text;
        renderSidebarConversations();
    }
    saveState();

    input.value = '';
    input.style.height = 'auto';
    $('#chat-title').textContent = conv.title;
    $('#chat-subtitle').textContent = `${conv.messages.length} message${conv.messages.length !== 1 ? 's' : ''}`;

    const area = $('#chat-area');
    const welcome = $('.welcome', area);
    if (welcome) welcome.remove();
    area.insertAdjacentHTML('beforeend', userHTML(text));

    // Typing indicator
    const typingId = 'typing-' + Date.now();
    area.insertAdjacentHTML('beforeend', `<div class="message assistant" id="${typingId}"><div class="msg-avatar">${avatarLabel(false)}</div><div class="bubble"><div class="typing"><span>retrieving & reranking</span><span class="typing-cursor"></span></div></div></div>`);
    area.scrollTop = area.scrollHeight;

    // Animate pipeline
    const steps = [
        { icon: 'Q', label: 'Query', state: 'pending' },
        { icon: 'B', label: 'BM25', state: 'pending' },
        { icon: 'D', label: 'Dense', state: 'pending' },
        { icon: 'R', label: 'RRF', state: 'pending' },
        { icon: 'CE', label: 'Rerank', state: 'pending' },
        { icon: '✓', label: 'Done', state: 'pending' }
    ];

    let stepIdx = 0;
    function advanceStep() {
        if (stepIdx > 0) steps[stepIdx - 1].state = 'done';
        if (stepIdx < steps.length) {
            steps[stepIdx].state = 'active';
            stepIdx++;
            setTimeout(advanceStep, 180);
        } else {
            // Replace typing with response
            const typingEl = document.getElementById(typingId);
            if (typingEl) typingEl.remove();

            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.send_query(text, APP.settings).then(response => {
                    let responseText = response.success ? response.text.replace(/\n/g, '<br>') : `Error: ${response.error}`;
                    let sources = response.success ? response.sources : [];
                    
                    conv.messages.push({ role: 'assistant', content: responseText, pipeline: steps, sources });
                    APP.queryCount++;
                    APP.activity.unshift({ type: 'query', text: `Queried: ${text.slice(0, 50)}${text.length > 50 ? '...' : ''}`, time: 'Just now' });
                    area.insertAdjacentHTML('beforeend', assistantHTML(responseText, steps, sources));
                    area.scrollTop = area.scrollHeight;
                    saveState();
                });
            } else {
                let responseText = `Cannot connect to Python backend! Please run the app via 'python app/desktop.py' to enable pywebview api integration.<br><br><b>Your Query:</b> ${esc(text)}`;
                conv.messages.push({ role: 'assistant', content: responseText, pipeline: steps, sources: [] });
                APP.queryCount++;
                APP.activity.unshift({ type: 'query', text: `Mock Queried: ${text.slice(0, 50)}...`, time: 'Just now' });
                area.insertAdjacentHTML('beforeend', assistantHTML(responseText, steps, []));
                area.scrollTop = area.scrollHeight;
                saveState();
            }
        }
    }
    advanceStep();
}

    });

function toggleSelectAll(cb) {
    $$('.doc-check').forEach(c => c.checked = cb.checked);
}

function deleteDocument(id) {
    if(confirm('Delete this document?')) {
        const docToDelete = APP.documents.find(d => d.id === id);
        if (!docToDelete) return;
        
        if (window.pywebview && window.pywebview.api) {
            showToast('Deleting from database...', 'info');
            window.pywebview.api.delete_document(docToDelete.name).then(res => {
                if (res.success) {
                    APP.documents = APP.documents.filter(d => d.id !== id);
                    showToast('document permanently removed', 'success');
                    renderDocuments();
                    renderAnalytics();
                    saveState();
                } else {
                    showToast('Failed to delete: ' + res.error, 'error');
                }
            });
        } else {
            APP.documents = APP.documents.filter(d => d.id !== id);
            showToast('document removed (UI only)', 'success');
            renderDocuments();
            renderAnalytics();
            saveState();
        }
    }
}

function handleGlobalUpload(e) { processFiles(e.target.files); e.target.value = ''; }

function triggerNativeUpload() {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_upload_dialog) {
        showToast("opening secure file dialog...", "info");
        window.pywebview.api.open_upload_dialog().then(response => {
            if (response.success && response.files && response.files.length > 0) {
                response.files.forEach(filename => {
                    const doc = {
                        id: APP.nextDocId++,
                        name: filename,
                        ext: filename.split('.').pop().toLowerCase(),
                        chunks: response.chunks,
                        status: 'indexed',
                        added: new Date().toISOString().slice(0, 10),
                        content: ''
                    };
                    APP.documents.push(doc);
                    showToast(`indexed ${filename} (${response.chunks} chunks)`, 'success');
                    APP.activity.unshift({ type: 'upload', text: `Uploaded ${filename}`, time: 'Just now' });
                });
                saveState();
                if (APP.view === 'documents') renderDocuments();
                if (APP.view === 'analytics') renderAnalytics();
            } else if (response.error) {
                showToast(`Upload failed: ${response.error}`, "error");
            }
        });
    } else {
        document.getElementById('file-input-global').click();
    }
}

/* ========================================
   File Upload & Processing
   ======================================== */
function processFiles(files) {
    if (!files || files.length === 0) return;
    for (const file of files) {
        const parts = file.name.split('.');
        const ext = parts.length > 1 ? parts.pop().toLowerCase() : 'txt';
        const doc = {
            id: APP.nextDocId++,
            name: file.name,
            ext: ext,
            chunks: 0,
            status: 'indexing',
            added: new Date().toISOString().slice(0, 10),
            content: ''
        };

        // Read text-based files
        if (['txt', 'md', 'csv', 'py'].includes(ext)) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                doc.content = ev.target.result;
                doc.chunks = Math.max(1, Math.ceil(doc.content.length / 500));
                doc.status = 'indexed';
                showToast(`indexed ${file.name} (${doc.chunks} chunks)`, 'success');
                APP.activity.unshift({ type: 'upload', text: `Uploaded ${file.name}`, time: 'Just now' });
                saveState();
                if (APP.view === 'documents') renderDocuments();
                if (APP.view === 'analytics') renderAnalytics();
            };
            reader.readAsText(file);
        } else {
            // For binary files, estimate chunks from size
            doc.chunks = Math.max(1, Math.ceil(file.size / 2000));
            setTimeout(() => {
                doc.status = 'indexed';
                showToast(`indexed ${file.name} (${doc.chunks} chunks)`, 'success');
                APP.activity.unshift({ type: 'upload', text: `Uploaded ${file.name}`, time: 'Just now' });
                saveState();
                if (APP.view === 'documents') renderDocuments();
            }, 800);
        }

        APP.documents.unshift(doc);
    }
    saveState();
    $('#nav-doc-count').textContent = APP.documents.length;
    if (APP.view === 'documents') renderDocuments();
    showToast(`${files.length} file${files.length > 1 ? 's' : ''} uploading...`, 'info');
}

/* ========================================
   Global Drag & Drop
   ======================================== */
let dragCounter = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; $('#drop-overlay').classList.add('active'); });
document.addEventListener('dragleave', e => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { dragCounter = 0; $('#drop-overlay').classList.remove('active'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    $('#drop-overlay').classList.remove('active');
    if (e.dataTransfer.files.length > 0) processFiles(e.dataTransfer.files);
});

        </div>
        <div class="settings-section">
            <h3>// model configuration</h3>
            <div class="setting-row">
                <div class="setting-label"><span>llm_engine</span></div>
                <select class="setting-select" onchange="updateSetting('model',this.value);$('#model-label').textContent=this.options[this.selectedIndex].text.split('(')[0].trim()">
                    <option value="gemma-2-2b-native" ${s.model === 'gemma-2-2b-native' ? 'selected' : ''}>Deepset Gemma 2 2B Native (Offline)</option>
                </select>
            </div>
            <div class="setting-row">
                <div class="setting-label"><span>cross_encoder_reranker</span></div>
                <div class="setting-toggle" onclick="toggleSetting('reranker');renderSettings()">
                    <div class="toggle-track ${s.reranker ? 'on' : ''}"></div>
                    <span class="toggle-label">${s.reranker ? '[enabled]' : '[disabled]'}</span>
                </div>
                <div class="setting-hint">re-score retrieved candidates with BAAI/bge-reranker-base.</div>
            </div>
            <div class="setting-row">
                <div class="setting-label"><span>hybrid_rrf_search</span></div>
                <div class="setting-toggle" onclick="toggleSetting('hybrid');renderSettings()">
                    <div class="toggle-track ${s.hybrid ? 'on' : ''}"></div>
                    <span class="toggle-label">${s.hybrid ? '[enabled] BM25 + Dense' : '[disabled] Dense Only'}</span>
                </div>
                <div class="setting-hint">combine sparse BM25 keyword matching with dense semantic vectors.</div>
            </div>
        </div>
        <div class="settings-section danger-zone">
            <h3>// data management</h3>
            <button class="danger-btn" onclick="wipeDatabaseAction(this)">wipe &amp; re-create chromadb collection</button>
        </div>`;
}

function wipeDatabaseAction(btn) {
    if(!confirm('This will permanently delete all documents and chunks. Continue?')) return;
    btn.textContent = 'wiping...';
    btn.disabled = true;
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.wipe_database().then(res => {
            btn.textContent = 'wipe & re-create chromadb collection';
            btn.disabled = false;
            if (res.success) {
                APP.documents=[];
                APP.nextDocId=1;
                showToast('database wiped','success');
                renderDocuments();
                renderAnalytics();
                saveState();
            } else {
                showToast('Failed to wipe: ' + res.error, 'error');
            }
        });
    } else {
        APP.documents=[];
        APP.nextDocId=1;
        showToast('database wiped','success');
        renderDocuments();
        renderAnalytics();
        saveState();
        btn.textContent = 'wipe & re-create chromadb collection';
        btn.disabled = false;
    }
}

function updateSetting(key, val) {
    APP.settings[key] = typeof val === 'string' && !isNaN(val) ? Number(val) : val;
    saveState();
}

function toggleSetting(key, btn) {
    APP.settings[key] = !APP.settings[key];
    if (btn) btn.classList.toggle('active', APP.settings[key]);
    saveState();
}

function reindexAll() {
    showToast('re-indexing all documents...', 'info');
    setTimeout(() => showToast('all documents re-indexed', 'success'), 1500);
}

/* ========================================
   Command Palette
   ======================================== */
const COMMANDS = [
    { group: 'navigation', label: 'Go to Chat', shortcut: 'Ctrl+1', action: () => switchView('chat') },
    { group: 'navigation', label: 'Go to Documents', shortcut: 'Ctrl+2', action: () => switchView('documents') },
    { group: 'navigation', label: 'Go to Analytics', shortcut: 'Ctrl+3', action: () => switchView('analytics') },
    { group: 'navigation', label: 'Go to Settings', shortcut: 'Ctrl+4', action: () => switchView('settings') },
    { group: 'chat', label: 'New Conversation', shortcut: 'Ctrl+N', action: () => createConversation() },
    { group: 'chat', label: 'Clear Current Chat', action: () => clearCurrentChat() },
    { group: 'documents', label: 'Upload Files', action: () => { switchView('documents'); triggerNativeUpload(); } },
    { group: 'documents', label: 'Re-Index All Documents', action: () => reindexAll() },
    { group: 'settings', label: 'Reset Settings to Defaults', action: () => { APP.settings = { chunkSize: 500, chunkOverlap: 50, topK: 10, rerankTopK: 3, reranker: true, hybrid: true, model: 'gemma-3-4b-native' }; renderSettings(); showToast('settings reset', 'success'); saveState(); } },
    { group: 'settings', label: 'Toggle Reranker', action: () => { APP.settings.reranker = !APP.settings.reranker; showToast(`reranker ${APP.settings.reranker ? 'enabled' : 'disabled'}`, 'info'); saveState(); } },
    { group: 'settings', label: 'Toggle Hybrid Search', action: () => { APP.settings.hybrid = !APP.settings.hybrid; showToast(`hybrid search ${APP.settings.hybrid ? 'enabled' : 'disabled'}`, 'info'); saveState(); } }
];

let cmdSelectedIdx = 0;
let cmdFiltered = [...COMMANDS];

function openCmdPalette() {
    const overlay = $('#cmd-overlay');
    overlay.classList.add('active');
    const input = $('#cmd-input');
    input.value = '';
    cmdSelectedIdx = 0;
    cmdFiltered = [...COMMANDS];
    renderCmdList();
    setTimeout(() => input.focus(), 50);
}

function closeCmdPalette() {
    $('#cmd-overlay').classList.remove('active');
}

function renderCmdList() {
    const list = $('#cmd-list');
    let html = '';
    let lastGroup = '';
    cmdFiltered.forEach((cmd, i) => {
        if (cmd.group !== lastGroup) { lastGroup = cmd.group; html += `<div class="cmd-group">${cmd.group}</div>`; }
        html += `<div class="cmd-item ${i === cmdSelectedIdx ? 'selected' : ''}" onclick="executeCmd(${i})" onmouseenter="cmdSelectedIdx=${i};renderCmdList()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
            <span class="cmd-item-text">${cmd.label}</span>
            ${cmd.shortcut ? `<span class="cmd-item-shortcut">${cmd.shortcut}</span>` : ''}
        </div>`;
    });
    if (cmdFiltered.length === 0) html = '<div style="padding:14px;text-align:center;color:var(--text-muted);font-size:0.8rem">// no matching commands</div>';
    list.innerHTML = html;
}

function executeCmd(idx) {
    const cmd = cmdFiltered[idx];
    if (cmd) { closeCmdPalette(); cmd.action(); }
}

$('#cmd-input').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    cmdFiltered = COMMANDS.filter(c => c.label.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
    cmdSelectedIdx = 0;
    renderCmdList();
});

$('#cmd-input').addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdSelectedIdx = Math.min(cmdSelectedIdx + 1, cmdFiltered.length - 1); renderCmdList(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); cmdSelectedIdx = Math.max(cmdSelectedIdx - 1, 0); renderCmdList(); }
    if (e.key === 'Enter') { e.preventDefault(); executeCmd(cmdSelectedIdx); }
    if (e.key === 'Escape') { closeCmdPalette(); }
});

$('#cmd-overlay').addEventListener('click', function(e) { if (e.target === this) closeCmdPalette(); });

/* ========================================
   Keyboard Shortcuts
   ======================================== */
document.addEventListener('keydown', e => {
    // Ctrl+K: Command palette
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); const o = $('#cmd-overlay'); o.classList.contains('active') ? closeCmdPalette() : openCmdPalette(); }
    // Ctrl+N: New chat
    if ((e.ctrlKey || e.metaKey) && e.key === 'n' && !e.shiftKey) { e.preventDefault(); createConversation(); switchView('chat'); }
    // Ctrl+1-4: Switch views
    if ((e.ctrlKey || e.metaKey) && e.key >= '1' && e.key <= '4') { e.preventDefault(); switchView(['chat', 'documents', 'analytics', 'settings'][parseInt(e.key) - 1]); }
    // Escape: Close overlays
    if (e.key === 'Escape') {
        if ($('#cmd-overlay').classList.contains('active')) closeCmdPalette();
        $('#sidebar').classList.remove('open');
    }
});

/* ========================================
   Auto-resize textarea
   ======================================== */
$('#query-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = this.scrollHeight + 'px';
});

/* ========================================
   Initialization
   ======================================== */
function init() {
    renderSidebarConversations();
    renderChat();
    renderDocuments();
}

init();
</script>
</body>
</html>
